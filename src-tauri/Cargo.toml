[package]
name = "cmdbox"
version = "0.1.0"
description = "CmdBox Windows desktop application"
authors = ["CmdBox contributors"]
edition = "2021"

[lib]
# Windows 上二进制与库不能同名，因此保留 `_lib` 后缀。
name = "cmdbox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
